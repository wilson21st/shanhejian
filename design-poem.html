<!-- 吟诗 design mock (hs-poem-people-1110). design-poem.html = poem list; ?p=<id> plays one poem as a short show:
     引子 (background over a PD painting) → 你猜 (a question, the show waits) → 吟 (the poem written column by column in a brush
     font, right to left, while voice A recites it) → 字词 (tap a glowing character) → 争议 (two books) → 出处.
     Data: data/design-poem/<id>.json from tools/design-poem/poems.mjs (build.mjs); audio: tools/design-poem/gen-audio.mjs.
     Brush font: Ma Shan Zheng (OFL), subset to the poems' glyphs → data/design-poem/fonts/. Test hooks: window.__dp, ?mute=1,
     ?speed=N, ?auto=1 (auto-start, auto-pick choice 0).
     v2 (hs-poem-v2-1110, Wilson: 读诗要有感情 · 背景音乐 · 书法要生动、有几款字体拣): ⚙ panel / ?voice=<id> picks the reciting voice
     (data/design-poem/yin.json from tools/design-poem/gen-yin.mjs: Edge 抑扬 voices + CosyVoice3 by mood, each line with per-character
     start marks so the brush follows the voice); ?font=<id> picks the brush font (tools/design-poem/fonts.mjs subsets, all OFL);
     ?compare=1 shows the poem in every font side by side. Each character is brushed in top-to-bottom with a little tilt/size/ink
     jitter and a dry-brush edge. Music: data/design-poem/bgm/<poem>.mp3 through a Web Audio gain (iOS ignores .volume), started
     on the 吟 tap, ducked under any voice, a little louder while the brush writes; ♪ in the ⚙ panel (remembered), ?bgm=0.
     v3 (hs-poem-brush-1110, Wilson: 志莽行书 but wet ink, not a printed texture; 原版云健 only): the voice is locked to edge
     (原版 云健) and the voice picker hidden. WET poems (黄鹤楼 only, the demo; ?ink=wet|dry overrides) drop the dry-brush noise
     for #wet (blur + alpha threshold: crisp edges, ink pooled at stroke ends and joints, a faint bleed round it); each
     character is written in top to bottom with its first row left to right (two masks, intersected) and darkens as it dries;
     the seal is a carved 白文 篆书 stamp「姓氏+字」, data/design-poem/seal/<id>.svg from tools/design-poem/seal2.py (v135), pressed on. -->

/* v136 (Wilson 08:42): 志莽行书 lacks 纔 浥 鄜 咷 — only those four glyphs come from 霞鹜臻楷 (OFL), per glyph via the font stack;
   the poem is no longer switched whole to 霞鹜文楷 */
@font-face{font-family:"DP-fb";src:url("data/design-poem/fonts/zhenkai-fb.woff2") format("woff2");font-display:block;unicode-range:U+54B7,U+6D65,U+7E94,U+911C}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#15130e;color:#f3ead6;font-family:"LXGW WenKai","Kaiti SC","STKaiti",serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
/* v134 (Wilson 23:52: 喺电脑度个吟诗好窄) — the show takes the whole window on every screen, no 560px column */
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
@media (min-width:900px){#set{left:auto;width:440px}body.pl #cards{left:50%;right:auto;width:min(640px,calc(100% - 16px));transform:translateX(-50%)}}
/* top: the six beats */
#top{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px 6px}
#top a{color:#f3ead6;text-decoration:none;font-size:14px;border:1.5px solid #f3ead640;border-radius:4px;padding:3px 8px}
#beats{flex:1;display:flex;gap:4px}
#beats b{flex:1;font-weight:normal;font-size:13px;text-align:center;border-bottom:3px solid #f3ead626;color:#f3ead670;padding-bottom:2px}
#beats b.done{border-color:#b3261b88;color:#e8b9a8}
#beats b.on{border-color:#e2584a;color:#fff}
/* stage: painting + Ken Burns + the paper the poem is written on */
#stage{flex:0 0 auto;height:56vh;position:relative;overflow:hidden;background:#0d0c09}
.sl{position:absolute;inset:0;overflow:hidden;opacity:0}
.sl .back{position:absolute;inset:-30px;background:center/cover;filter:blur(18px) brightness(.45)}
.sl img{position:absolute;left:0;top:0;will-change:transform}
.sl .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,#0000 55%,#0009),linear-gradient(#0000 75%,#000b)}
.sl .cap{position:absolute;left:10px;right:10px;bottom:6px;font-size:11px;color:#f3ead6b0;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* v133 (Wilson 13:15: no 宣纸 panel; 13:35: no dimming) — the poem is written straight onto the painting. layPaper samples the
   painting under the text (tone()): a light one takes dark ink with a pale halo, a dark one light ink with an ink halo; #veil is a
   feathered local wash (no edge) only as strong as the sampled background needs for the ink to read */
/* v137 (Wilson 09:41: 诗字后面有层白雾): no #veil wash and no pale halo — the ink sits on the painting itself.
   v138 (Wilson 10:28): black ink on a light painting, the pale ink (#paper.dk) on a dark one — tone() picks per poem */
#chips{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:3;transition:opacity .6s}
#chips span{background:#16140fcc;border:1px solid #f3ead640;border-radius:12px;padding:2px 9px;font-size:13px}
#chips span:first-child{border-color:#e2584a;color:#ffb3a3}
#paper{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);opacity:0;transition:opacity .9s,transform .9s;z-index:2;
  padding:16px 12px;display:flex;flex-direction:row-reverse;gap:var(--gap);color:#1b160e}
#paper.dk{color:#f6efdd}
#paper.on{opacity:1;transform:translate(-50%,-50%)}
#paper .ttl{display:flex;flex-direction:column;align-items:center;font:calc(var(--cell)*.62) var(--brush),serif;line-height:1.1;color:#3a2e1c;padding-top:2px;margin-left:calc(var(--gap)*.6)}
#paper .ttl small{font-size:.7em;color:#7a6440;margin-top:.5em}
#paper .ttl span.vr{rotate:90deg}
#paper .ttl{color:#1b160e}#paper .ttl small{color:#2e2416}#paper.dk .ttl{color:#fbf5e6}#paper.dk .ttl small{color:#f1e6c9}
#paper.wet .ttl{filter:none}
.col{display:flex;flex-direction:column}
/* halo as text-shadow on each character (painted once with its glyph), not drop-shadow on the column: a column filter chain
   re-rasterises every frame while ink animates over the moving slide (p23 jank) */
.col{filter:url(#dry)}
.col i{text-shadow:none}
#paper.dk .col i{color:color-mix(in srgb,#f6efdd calc(var(--o,1)*100%),#cdbb96)}
/* one character = one brush touch: wiped in top to bottom (mask), wet and soft at first, then dry; each keeps a small tilt,
   size, offset and ink-density of its own (--r --s --x --y --o, set in layPaper) so the column is written, not typeset */
.col i{font:var(--cell)/1 var(--brush),serif;font-style:normal;width:var(--cell);height:calc(var(--cell)*1.06);text-align:center;opacity:0;position:relative;
  transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg)) scale(var(--s,1));color:color-mix(in srgb,#1b160e calc(var(--o,1)*100%),#5a4528)}
.col i.ink{opacity:1;animation:brush var(--dur,.6s) cubic-bezier(.3,.6,.4,1) forwards;-webkit-mask-image:linear-gradient(#000 40%,#0000 60%);mask-image:linear-gradient(#000 40%,#0000 60%);
  -webkit-mask-size:100% 250%;mask-size:100% 250%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:0 0;mask-position:0 0}
@keyframes brush{0%{-webkit-mask-position:0 100%;mask-position:0 100%;text-shadow:0 0 calc(var(--cell)*.08) #1b160ecc;filter:blur(.8px)}
  55%{text-shadow:0 0 calc(var(--cell)*.05) #1b160e66;filter:blur(.3px)}100%{-webkit-mask-position:0 0;mask-position:0 0;text-shadow:0 0 1px #1b160e33;filter:none}}
.col i.shown{opacity:1}
.col i.glow{cursor:pointer}   /* v136: black ink stays black; the pulsing red dot marks the word */
.col i.glow::after{content:"";position:absolute;left:50%;bottom:-1px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#e2584a;animation:pulse 1.3s infinite}
.col i.pick{background:#e2584a33;border-radius:4px}
@keyframes pulse{50%{transform:scale(1.8);opacity:.4}}
.col.now i.shown{color:#000}#paper.dk .col.now i.shown{color:#fff}#paper.dk .col i.glow{color:#ff9a8a}
#paper .seal{align-self:flex-end;width:calc(var(--cell)*.8);height:calc(var(--cell)*.8);border:2px solid #b3261b;color:#b3261b;border-radius:3px;
  font:calc(var(--cell)*.32)/1.05 var(--brush),serif;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transform:scale(2) rotate(-8deg);margin-right:calc(var(--gap)*-.3)}
/* v3 wet ink: the --ink each character dries to; the write mask: layer 1 top to bottom, layer 2 left to right, faster */
/* v134 real ink (Wilson 23:52: 个书法效果好懵 — 要好似墨汁渗落纸咁): the glyph itself is drawn crisp — no #wet blur filter, no
   halo, no soft fade. The brush front is a hard edge (the wipe's ramp is ~a quarter of a character, not two characters);
   the stroke lands wet — glossy, blacker than it will be — and dries in 2.4 s to its own ink tone (dried ink is lighter and
   browner); under it a copy of the glyph (::before, data-c) is the ink soaking into the paper: a soft spread that swells
   while wet and stays as a faint feathered edge once dry. Light ink on a dark painting dries the same way, without the
   lasting spread (pale ink would read as a glow). Only opacity / colour animate, per character, while it is written. */
#paper.wet .col{filter:none}
#paper.wet .col i{--ink:color-mix(in srgb,#0d0a06 calc(var(--o,1)*100%),#3b2d1b);color:var(--ink);text-shadow:none}
#paper.wet.dk .col i{--ink:color-mix(in srgb,#fbf5e6 calc(var(--o,1)*100%),#d8c7a2)}
#paper.wet .col i::before{content:attr(data-c);position:absolute;inset:0;color:var(--ink);opacity:0;pointer-events:none;
  text-shadow:0 0 calc(var(--cell)*.035) var(--ink),0 0 calc(var(--cell)*.09) color-mix(in srgb,var(--ink) 55%,#0000)}
#paper.wet .col i.ink{animation:write var(--dur,.9s) cubic-bezier(.35,.1,.45,1) forwards,dry 2.4s ease-out forwards;
  -webkit-mask-image:linear-gradient(172deg,#000 46.5%,#0000 53.5%);mask-image:linear-gradient(172deg,#000 46.5%,#0000 53.5%);
  -webkit-mask-size:100% 400%;mask-size:100% 400%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:0 0;mask-position:0 0}
#paper.wet .col i.ink::before{animation:bleed 2.6s ease-out forwards}
#paper.wet .col i.shown::before{opacity:.12}#paper.wet.dk .col i.shown::before{opacity:0}
/* v3.1 seep: a line's characters all start at once, each delayed (--dl) so the next begins well before the last ends */
#paper.wet .col i.ink.seep{animation:write var(--dur) linear var(--dl,0s) both,dry 2.4s ease-out var(--dl,0s) both}
#paper.wet .col i.ink.seep::before{animation:bleed 2.6s ease-out var(--dl,0s) both}
#paper.hold i,#paper.hold i::before,#paper.hold .seal{animation-play-state:paused}
@keyframes write{0%{-webkit-mask-position:0 100%;mask-position:0 100%}100%{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes dry{0%{color:#000}35%{color:color-mix(in srgb,#000 60%,var(--ink))}100%{color:var(--ink)}}
@keyframes dryL{0%{color:#fff}35%{color:color-mix(in srgb,#fff 60%,var(--ink))}100%{color:var(--ink)}}
@keyframes bleed{0%{opacity:0}18%{opacity:.42}100%{opacity:.12}}
@keyframes bleedL{0%{opacity:0}18%{opacity:.3}100%{opacity:0}}
#paper.wet.dk .col i.ink,#paper.wet.dk .col i.ink.seep{animation-name:write,dryL}
#paper.wet.dk .col i.ink::before,#paper.wet.dk .col i.ink.seep::before{animation-name:bleedL}
/* v138: pale ink keeps no glow at all, not even while wet (a pale blur around the stroke read as the fog Wilson removed) */
#paper.wet.dk .col i::before{text-shadow:none}
@media (prefers-reduced-motion:reduce){#paper.wet .col i::before{animation:none!important;opacity:.12}#paper.wet.dk .col i::before{opacity:0}}
#paper.dk .seal{border-color:#ef5a4c;color:#ef5a4c}
/* v135 seal (Wilson picked option 1 of design-poem-seals2.html): one 白文方印「姓氏+字」 per poet, 李氏太白 / 杜氏子美 …, from
   tools/design-poem/seal2.py. Paper-pale behind the stone's middle only, so the cut characters read as paper on any painting;
   pressed in as on the seals page: drops from above and larger, lands darker, the paste spreads from the middle, settles at .94 */
#paper .seal.stamp{border:0;border-radius:0;width:calc(var(--cell)*1.05);height:auto;mix-blend-mode:normal;opacity:0;
  background:linear-gradient(#f6efe0,#f6efe0) center/80% 80% no-repeat;
  -webkit-mask-image:radial-gradient(closest-side,#000 70%,#0000);mask-image:radial-gradient(closest-side,#000 70%,#0000);
  -webkit-mask-position:50% 50%;mask-position:50% 50%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:300% 300%;mask-size:300% 300%}
#paper .seal.stamp.on{animation:press .62s cubic-bezier(.25,.7,.3,1) forwards}
@keyframes press{0%{opacity:0;transform:translate(4%,-14%) scale(1.22) rotate(-3deg);filter:blur(1.2px);-webkit-mask-size:0% 0%;mask-size:0% 0%}
  30%{opacity:1;transform:scale(.965);filter:saturate(1.35) brightness(.78)}
  55%{transform:scale(1.008);-webkit-mask-size:300% 300%;mask-size:300% 300%}
  100%{opacity:.94;transform:scale(1);filter:none;-webkit-mask-size:300% 300%;mask-size:300% 300%}}
#paper .seal.on{animation:stamp .45s cubic-bezier(.5,0,.7,1.4) forwards}
@keyframes stamp{60%{opacity:.95;transform:scale(.94) rotate(-6deg);filter:blur(.6px)}to{opacity:.88;transform:scale(1) rotate(-6deg);filter:url(#dry)}}

    sec('出处');const body=GEN?S.lines.map(esc).join('<br>')+(S.excerpt?'<br><span class="ex">（节选）</span>':''):S.text.map((t,i)=>t+(i%2?'。<br>':'，')).join('');
    el('div','src',`<h4>${esc(GEN?S.full:S.title)} · ${esc(S.poet)}</h4>${body}${GEN&&S.summary?`<div class="sum">${esc(S.summary)}</div>`:''}<br>出处：${S.src.url?`<a href="${S.src.url}" target="_blank">${esc(S.src.book)}</a>`:esc(S.src.book)}${GEN?'':'（维基文库）'}<br><span class="conf">${esc(S.src.note)}<br>系年：${esc(S.date.said)}${S.date.conf?' —— '+esc(S.date.conf):''}</span>${GEN?(HV?'<br><span class="conf">吟诵：合成语音（Edge 云健），与三首有声诗同一把声</span>':'<br><span class="conf">这首没有录音：毛笔写字，字幕代读</span>'):''}${V4P?credit():RICH?`<br><span class="conf">画：${esc(RICH.img.cap)}（${esc(RICH.img.lic)}） · 乐：${esc(BGM_NAME[RICH.bgm]||'')}</span>`:''}${FONT_WHY?`<br><span class="conf">字：${esc(FONT_WHY)}，整首改用${esc(FONT.name)}</span>`:''}`,$('tx'));down();
    if(PID||HV)parent.postMessage({type:'narr',on:false},'*');bgm('end',3);
    // v133 (Wilson 13:35: the end dimmed the page and popped two buttons — abrupt): no end overlay. The poem rests on its

    if(!GEN){const a=el('div','lm','<a href="#">听来龙去脉（引子 · 你猜 · 争议）›</a>',$('tx'));a.querySelector('a').onclick=e=>{e.preventDefault();
      $('beats').innerHTML=BEATS.map(b=>`<b>${b}</b>`).join('');$('tx').innerHTML='';show(0)}}
    bar();down()
  }catch(e){if(e!==STOP)throw e}}
// ---- the show ----
async function show(from=0){const r=++run;paused=false;$('paper').classList.remove('hold');if(CK){CK.stop();CK=null}au.pause();$('choices').innerHTML='';waiting=null;bar();
  try{
    if(from<=0){setBeat(0);sec('引子');await say(S.intro,r)}
    if(from<=1){setBeat(1);sec('你猜');const g=S.guess;el('div','q','<small>说书人问你</small>'+esc(g.t),$('tx'));down();
      await speak(g.q,'',r);chk(r);line=null;const i=await dock(g.choices,'你猜——');chk(r);
      el('div','ln you',`<span>${esc(g.choices[i].label)}</span>`,$('tx'));line=null;await say(g.choices[i].react,r);await say(g.reveal,r);
      if(g.cite){el('div','cite',`${esc(g.cite.q)}<div>—— ${esc(g.cite.loc)}</div>`,$('tx'));down()}
      await dock([{label:'听诗 ▸',go:1}]);chk(r)}
    if(from<=2){setBeat(2);sec('吟');$('paper').classList.remove('on');$('chips').style.opacity=1;
      if(S.yinSlide)slide(S.yinSlide);await say(S.yinIntro,r);await recite(r)}
    if(from<=3){setBeat(3);sec('字词');if(!$('paper').classList.contains('on'))await recite(r);
      for(const w of S.words){const c=$('paper').querySelector(`i[data-l="${w.line}"][data-p="${w.pos}"]`);c.classList.add('glow');c.onclick=()=>word(w,c)}
      const seen=new Set();
      for(;;){const k=await dock([{label:'下一段：争议 ▸',go:1}],'点纸上发红的字，听它的意思');chk(r);break}
      $('paper').querySelectorAll('i.glow').forEach(c=>{c.classList.remove('glow')})}
    if(from<=4&&S.debate){setBeat(4);sec('争议');const d=S.debate;el('div','q','<small>几部书 · 你信哪个</small>'+esc(d.t),$('tx'));
      const B=el('div','books','',$('tx'));for(const b of d.books)el('div','book',`<div class="lens">${b.lens}</div><div class="src">《${esc(b.src)}》</div><div class="bq">${esc(b.q)}</div><div class="gist">${b.gist}</div>`,B);down();
      await speak(d.q,'',r);chk(r);line=null;const i=await dock(d.choices,'你信哪个？');chk(r);
      el('div','ln you',`<span>${esc(d.choices[i].label)}</span>`,$('tx'));line=null;await say(d.choices[i].react,r);await say(d.reveal,r)}
    setBeat(5);sec('出处');await say(S.outro,r);
    el('div','src',`<h4>${esc(S.title)} · ${esc(S.poet)}</h4>${S.text.map((t,i)=>t+(i%2?'。<br>':'，')).join('')}<br>出处：<a href="${S.src.url}" target="_blank">${esc(S.src.book)}</a>（维基文库）<br><span class="conf">${esc(S.src.note)}<br>系年：${esc(S.date.said)} —— ${esc(S.date.conf)}</span><br><a href="${D}CREDITS.md" target="_blank">图片出处</a>`,$('tx'));down();
    // v133: the show ends quietly in every path (no end dock): ↺ 再吟一遍 is in the bar, 诗目 / ✕ at the top
    setBeat(6);bgm('end',3);bar();down()
  }catch(e){if(e!==STOP)throw e}}
async function word(w,c){if(speaking&&skipNow)skipNow();stat.words++;
  $('paper').querySelectorAll('i.pick').forEach(x=>x.classList.remove('pick'));c.classList.add('pick');
  line=null;el('div','word',`<b>${w.ch}</b><span>${esc(w.t)}</span>`,$('tx'));down();
  const file=AU[`narr|${w.a.p}|${w.a.t}`];if(file&&!mute){au.src=D+'audio/'+file;au.onended=null;au.play().catch(()=>{})}}
function bar(){$('pp').innerHTML=paused?'▶ 继续':'❚❚ 暂停';$('skip').disabled=!speaking;$('again').disabled=beat<3}
$('pp').onclick=()=>{paused=!paused;$('paper').classList.toggle('hold',paused);if(CK)paused?CK.a.pause():CK.a.play();if(paused)au.pause();else if(speaking&&!mute&&au.src&&!au.ended)au.play().catch(()=>{});bar();bgmApply(.4)};
$('skip').onclick=()=>skipNow&&skipNow();
$('again').onclick=async()=>{if(beat<3)return;const r=run;$('paper').querySelectorAll('i').forEach(c=>c.classList.remove('ink','seep','shown'));
  if(speaking&&skipNow)skipNow();const nr=(PID||HV)&&!mute;if(nr)parent.postMessage({type:'narr',on:true},'*');try{await recite(r)}catch(e){}if(nr)parent.postMessage({type:'narr',on:false},'*')};
$('snd').onclick=()=>{mute=!mute;$('snd').textContent=mute?'🔇':'🔊';if(mute)au.pause();bgmApply(.3)};
// ---- ⚙ panel + font comparison ----
$('gear').onclick=e=>{e.stopPropagation();$('set').classList.toggle('on')};
document.addEventListener('click',e=>{if($('set').classList.contains('on')&&!$('set').contains(e.target)&&e.target!==$('gear'))$('set').classList.remove('on')});
$('bgmBtn').onclick=()=>{bgmOn=!bgmOn;LS('bgm',bgmOn?'1':'0');bgmStart();bgmApply(.5)};
$('setAgain').onclick=()=>{$('set').classList.remove('on');if(beat<2){show(2);return}$('again').disabled=false;$('again').onclick()};
$('cmpBtn').onclick=()=>{$('set').classList.remove('on');compare()};
$('cmpX').onclick=()=>{$('cmp').classList.remove('on');urlSet('compare','0')};
let tryAu=null;
function panel(){const V=$('voices');V.innerHTML='';
  for(const v of (YIN&&YIN.voices)||[]){const e=el('div','vo'+(v.id===VOICE?' sel':''),`<b>${esc(v.label)}</b><span>${esc(v.note)}</span><button>▶ 试听</button>`,V);e.dataset.id=v.id;
    e.onclick=()=>{VOICE=v.id;LS('voice',v.id);urlSet('voice',v.id);V.querySelectorAll('.vo').forEach(x=>x.classList.toggle('sel',x.dataset.id===VOICE))};
    e.querySelector('button').onclick=ev=>{ev.stopPropagation();e.onclick();const mk=yinOf(0);if(!mk)return;bgmStart();if(tryAu)tryAu.pause();
      tryAu=new Audio(D+'audio/yin/'+mk.f);bgm('duck',.1);tryAu.onended=()=>{bgm(speaking?'duck':'base',.6);const m2=yinOf(1);if(m2&&tryAu.dataset.n!=='1'){tryAu=Object.assign(new Audio(D+'audio/yin/'+m2.f),{onended:()=>bgm('base',.6)});tryAu.dataset.n='1';tryAu.play()}};tryAu.play().catch(()=>{})}}
  const F=$('fonts');F.innerHTML='';const sample=S.text[0].slice(0,4);
  for(const f of FONTS){const e=el('div','fo'+(f.id===FONT.id?' sel':''),`<div style='font-family:${f.fam},serif'>${esc(sample)}</div><small>${f.name}<br>${f.note}</small>`,F);e.dataset.id=f.id;e.onclick=()=>setFont(f.id)}
  $('bgmBtn').textContent='♪ '+bedName();$('bgmBtn').classList.toggle('off',!bgmOn)}
function compare(){const G=$('cmpG');$('cmp').classList.add('on');urlSet('compare','1');$('cmpH').textContent=`${S.title} · ${S.poet} —— 点一款就用它`;G.innerHTML='';
  // phone: two across, the first four lines big enough to judge the brush; wider screens: three across, the whole poem
  const cols=innerWidth<700?2:3,lines=cols===2?S.text.slice(0,4):S.text,m=Math.max(...lines.map(t=>t.length));
  const cw=(Math.min(innerWidth,1100)-20-10*(cols-1))/cols,cell=Math.max(16,Math.min(44,Math.floor((cw-24)/(lines.length*1.2))));
  G.style.gridTemplateColumns=`repeat(${cols},1fr)`;G.style.setProperty('--cmpc',cell+'px');
  for(const f of FONTS){const e=el('div','card'+(f.id===FONT.id?' sel':''),`<div class='v' style='font-family:${f.fam},serif;height:${(cell*m*1.06).toFixed(0)}px'>${lines.map(esc).join('<br>')}</div><small>${f.name}<br>${f.note}</small>`,G);
    e.onclick=()=>{setFont(f.id);G.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');setTimeout(()=>$('cmpX').onclick(),350)}}}
setInterval(bar,300);
window.__dp={state:()=>({beat,speaking,waiting:waiting?waiting.opts.map(o=>o.label):null,ink:document.querySelectorAll('#paper i.ink').length,tone:TONE,stat,font:document.fonts.check(`40px ${FONT.fam}`,'鹤'),fontId:FONT.id,fontWhy:FONT_WHY,voice:VOICE,
    bgm:{on:bgmOn,mode:bgmMode,gain:bgmG?+bgmG.gain.value.toFixed(3):null,target:bgmLevel(),playing:!!bgmEl&&!bgmEl.paused,src:bgmEl?bgmEl.src.split('/').pop():null,k:+BK.toFixed(3),ac:bgmAC&&bgmAC.state}}),
  setFont,setVoice:id=>{VOICE=id;panel()},compare,
  choose:i=>waiting&&waiting.res(i),skip:()=>skipNow&&skipNow(),show,word:k=>{const w=S.words[k];word(w,$('paper').querySelector(`i[data-l="${w.line}"][data-p="${w.pos}"]`))}};
(async()=>{
  if(!PID&&!ID){const L=await fetch(D+'list.json').then(x=>x.json());$('list').style.display='block';
    for(const p of L)el('a','pc',`<div class="im" style="background-image:url('${D}img/${p.cover}')"></div><div class="bd"><div class="tt">${esc(p.title)}</div><div class="me">${esc(p.poet)} · 公元${p.year} · ${esc(p.form)}</div><div class="fl">${esc(p.first)}……</div><div class="hk">${esc(p.hook)}</div></div>`,$('cards')).href='design-poem.html?p='+p.id;
    window.__dp.ready=true;return}
  PL.init({emb:EMB});   // v132: the shared player frame (css/player.css, js/player.js)
  if(GEN){let YM;[S,YM]=await Promise.all([genS(ID),fetch(D+'yin-map.json').then(x=>x.ok?x.json():null).catch(()=>null)]);AU={};YIN=null;if(!S){document.body.textContent='没有这首诗：'+ID;return}
    if(YM&&YM[ID]&&YM[ID].length===S.yin.length)YIN={[ID]:{edge:YM[ID]}}
    // v133: the same parts as the three shows' map 吟 — painting, 引子 in the narrator's voice, music bed (map-shows.json)
    const MS=await fetch(D+'map-shows.json').then(x=>x.ok?x.json():null).catch(()=>null);RICH=MS&&MS[ID]||null;
    if(RICH){S.slides={m:{type:'img',...RICH.img}};S.cover=S.yinSlide='m';S.yinIntro=RICH.intro.map(c=>({...c,src:D+c.src}))}}
  else [S,AU,YIN]=await Promise.all([D+PID+'.json',D+'audio/index.json',D+'yin.json'].map(u=>fetch(u).then(x=>x.ok?x.json():null).catch(()=>null)));AU=AU||{};
  // v134: the map's poem (embedded, ?id=) plays its own bed and 3–4 paintings: cover + 引子 on paintings 2–4, the poem on the first
  if(ID){V4=await fetch(D+'v134.json').then(x=>x.ok?x.json():null).catch(()=>null);V4P=V4&&V4.poems[GEN?ID:PID]||null}
  if(V4P){const B=V4.bgm[V4P.bgm],im=V4P.img,n=im.length;BK=Math.min(1.6,10**((-21-B.lufs)/20));
    S.slides={};im.forEach((k,i)=>{const g=V4.img[k];S.slides['v'+i]={type:'img',src:g.f,cap:g.cap,lic:g.lic,focus:g.focus}});
    S.cover=S.yinSlide='v1';S.yinIntro=(S.yinIntro||[]).map((c,i)=>({...c,s:'v'+(1+(i+(n>3?1:0))%(n-1))}))}
  const VS=((YIN&&YIN.voices)||[]).map(v=>v.id);if(!VS.includes(VOICE))VOICE=VS[0]||VOICE;HV=!!yinOf(0);

  setFont(FONT.id,true);panel();if(P.get('compare')==='1')compare();
  $('app').style.display='flex';$('beats').innerHTML=ID?'':BEATS.map(b=>`<b>${b}</b>`).join('');
  if(ID){const a=$('top').querySelector('a'),x=el('button','xb',EMB?'✕ 回地图':'✕',null);a.replaceWith(x);x.onclick=toMap;
    $('top').insertBefore(el('div','eh',`${esc(S.poet)} · ${esc(GEN?S.full:S.title)} · ${HV?'有声':'书写'}`,null),$('beats'));
    addEventListener('keydown',e=>{if(e.key==='Escape')toMap()});if(GEN){if(!RICH)$('stage').classList.add('gen');$('gear').hidden=true}}
  document.title='吟诗 · '+S.title;fitTitle();document.fonts.ready.then(fitTitle);addEventListener('resize',fitTitle);$('title').querySelector('.p').textContent=S.poet+' · '+S.form;
  $('chips').innerHTML=GEN?`<span>${S.yl==='年代不详'?'年代不详':(S.yl[0]==='约'?'约':'')+'公元'+S.year}</span>${S.place?`<span>${esc(S.place.replace(/（.*/,''))}</span>`:''}<span>${esc(S.poet)}${genAge()?' '+genAge()+'岁':''}</span>`:`<span>公元${S.year}${S.pid==='p11'?' 前后':''}</span><span>${esc(S.place.replace(/（.*/,''))}</span><span>${esc(S.poet)}${S.age?' '+S.age+'岁':''}</span>`;
  if((!GEN||RICH)&&!(ID&&RMQ.matches)){slide(S.cover);Object.values(S.slides).forEach(s=>pre(s.src))}if(mute)$('snd').textContent='🔇';
  if(ID){$('title').querySelector('.p').textContent=S.poet+' · '+S.form+(HV?' · 有声':' · 书写');window.__dp.ready=true;
    // no voice to unlock: straight in. A recorded voice: try to play (the map's tap usually lets it); refused → the 吟 button
    // v139: inside the map the poem starts once the scroll has finished parting (the map posts 'shown'; 4 s fallback), so its
    // voice and first ink never land in the middle of the unroll
    let started=false;const go0=()=>{if(started)return;started=true;$('start').classList.add('off');setTimeout(()=>$('title').classList.add('off'),RMQ.matches?0:900);eshow()};
    let shown=!EMB;if(EMB){addEventListener('message',e=>{if(e.data&&e.data.type==='shown'){shown=true;if(want)go0()}});setTimeout(()=>{shown=true;if(want)go0()},4000)}
    let want=false;const go=()=>{want=true;if(shown||!$('start').classList.contains('off'))go0()};
    // before 吟 is tapped, ❚❚ is a second way in (it would otherwise pause a show that has not begun); every other button just works
    $('pp').addEventListener('click',e=>{if(!$('start').classList.contains('off')&&!started){e.stopImmediatePropagation();$('go').click()}},true);
    if(!HV||mute){if(!mute)bgmStart();go();return}
    const u0=GEN?D+'audio/yin/'+yinOf(0).f:D+'audio/'+(Object.values(AU)[0]||''),t=Object.assign(new Audio(u0),{volume:0});
    t.play().then(()=>{t.pause();bgmStart();go()}).catch(()=>{$('hook').textContent='点「吟」开声，听'+S.poet+'《'+S.title+'》';$('start').classList.remove('off');
      $('go').onclick=()=>{bgmStart();au.src=u0;au.play().then(()=>au.pause()).catch(()=>{});go()}});return}
  $('hook').textContent=S.hook;$('start').classList.remove('off');window.__dp.ready=true;
  $('go').onclick=()=>{bgmStart();au.src=D+'audio/'+(Object.values(AU)[0]||'');au.play().then(()=>au.pause()).catch(()=>{});$('start').classList.add('off');$('title').classList.add('off');show(+P.get('from')||0)};
