<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>说书 · 书目</title>
<link rel="icon" href="data/icon.svg?v=seal" type="image/svg+xml">
<link rel="icon" href="data/icon-32.png?v=seal" sizes="32x32">
<link rel="apple-touch-icon" href="data/icon-180.png?v=seal">
<!-- v119: 书目 for the 说书 engine. Lists data/shuoshu/stories.json (written by tools/shuoshu-script.mjs); each card opens
     shuoshu.html?s=<id>. The 你信哪个 line is each story's source dispute. -->
<link rel="stylesheet" href="data/vendor/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{touch-action:manipulation;background:#16140f;color:#f3ead6;font-family:"LXGW WenKai","Kaiti SC","STKaiti",serif;-webkit-tap-highlight-color:transparent}
body{padding:calc(18px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
header{text-align:center;margin-bottom:16px}
header h1{font-weight:normal;font-size:30px;letter-spacing:10px;margin-right:-10px}
header p{font-size:14px;color:#f3ead699;margin-top:6px;line-height:1.6}
.st{display:block;text-decoration:none;color:inherit;background:#221e17;border:1px solid #f3ead61f;border-radius:10px;overflow:hidden;margin-bottom:14px}
.st .pic{height:132px;background:#0d0c09 center/cover;position:relative}
.st .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 40%,#221e17)}
.st .yr{position:absolute;left:10px;top:8px;z-index:1;background:#a3271c;color:#fff;font-size:13px;padding:2px 8px;border-radius:3px}
.st .body{padding:2px 14px 12px;margin-top:-26px;position:relative}
.st h2{font-weight:normal;font-size:24px;letter-spacing:3px}
.st .era{font-size:12px;color:#f3ead680;margin-top:1px}
.st .bl{font-size:16px;line-height:1.6;margin-top:6px}
.st .dis{margin-top:8px;font-size:14px;line-height:1.55;color:#2a2318;background:#efe6d2;border-left:4px solid #b3261b;border-radius:5px;padding:7px 9px}
.st .dis b{color:#b3261b;font-weight:normal;margin-right:4px}
.st .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#f0c27acc;margin-top:8px}
.st .go{float:right;color:#ff8f6b;font-size:15px}
footer{font-size:12px;color:#f3ead666;text-align:center;line-height:1.7;margin-top:10px}
</style></head><body>
<header><h1>说书</h1><p>几段历史，评书讲法。讲到要紧处停下来问你；<br>每段都有一处「史书打架」，看你信边个。</p></header>
<main id="list"></main>
<footer>普通话配音为 Edge 神经语音（非真人）· 图片均为 Wikimedia Commons 公有领域 / CC</footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data/shuoshu/stories.json').then(r=>r.json()).then(L=>{
  document.getElementById('list').innerHTML=L.map(s=>`<a class="st" href="shuoshu.html?s=${esc(s.id)}">
    <div class="pic" style="background-image:url('data/shuoshu/${esc(s.id)}/img/${esc(s.cover)}')"><span class="yr">${esc(s.year)}</span></div>
    <div class="body"><h2>${esc(s.title)}</h2><div class="era">${esc(s.era)}</div><div class="bl">${esc(s.blurb)}</div>
    <div class="dis"><b>你信哪个？</b>${esc(s.dispute)}</div>
    <div class="meta"><span>${s.hui} 段</span><span>${s.questions} 道题</span><span>${s.asks} 个问题可问</span><span>约 ${s.mins} 分钟</span><span class="go">开书 ▸</span></div></div></a>`).join('');
});
</script>
</body></html>
