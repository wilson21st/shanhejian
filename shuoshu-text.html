<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>说书 · 社区</title>
<link rel="icon" href="data/icon.svg?v=seal" type="image/svg+xml">
<link rel="apple-touch-icon" href="data/icon-180.png?v=seal">
<!-- A community 说书 (text only), added through /mcp add_shuoshu and stored in D1: shuoshu-text.html?c=<id> reads it from
     /api/contrib (else the nightly snapshot data/contrib-d1.json) and lays it out 回 by 回 with its sources. -->
<link rel="stylesheet" href="data/vendor/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#16140f;color:#f3ead6;font-family:"LXGW WenKai","Kaiti SC","STKaiti",serif}
body{padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
a{color:#f0c27a}
nav{font-size:14px;margin-bottom:14px}
.tag{display:inline-block;background:#3f7a5c;color:#fff;font-size:12px;padding:2px 8px;border-radius:3px;margin-left:8px}
h1{font-weight:normal;font-size:32px;letter-spacing:6px;text-align:center;margin-top:6px}
.era{text-align:center;color:#f3ead699;font-size:14px;margin-top:4px}
.bl{font-size:17px;line-height:1.7;margin:16px 0 10px}
.dis{font-size:15px;line-height:1.6;color:#2a2318;background:#efe6d2;border-left:4px solid #b3261b;border-radius:5px;padding:8px 10px;margin-bottom:18px}
.dis b{color:#b3261b;font-weight:normal;margin-right:4px}
h2{font-weight:normal;font-size:21px;letter-spacing:2px;color:#f0c27a;margin:26px 0 8px;border-bottom:1px solid #f3ead61f;padding-bottom:4px}
.tx p{font-size:18px;line-height:1.95;margin-bottom:10px;text-indent:2em}
.src{margin-top:28px;font-size:13px;line-height:1.6;color:#f3ead6aa}
.src li{margin:0 0 6px 18px}
.note{margin-top:18px;font-size:12px;color:#f3ead666;text-align:center}
</style></head><body>
<nav><a href="shuoshu-list.html">← 书目</a><span class="tag">社区 · 文字版</span></nav>
<main id="m"><p class="era">载入中…</p></main>
<p class="note">读者或 AI 助手经 MCP 添加，未经编者审核；以下出处供核对。</p>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=new URLSearchParams(location.search).get('c')||'';
const jget=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
(async()=>{let s=null;
  for(const u of ['/api/contrib','data/contrib-d1.json']){const c=await jget(u);s=c&&(c.shuoshu||[]).find(x=>x.id===id);if(s)break}
  const m=document.getElementById('m');
  if(!s){m.innerHTML='<p class="era">找不到这段书。<a href="shuoshu-list.html">回书目</a></p>';return}
  document.title='说书 · '+s.title;
  const T={text:'正史',archaeology:'考古',inscription:'碑刻',artifact:'文物',art:'画作',foreign:'异域',modern:'今人研究'};
  m.innerHTML=`<h1>${esc(s.title)}</h1><div class="era">${esc(s.era)} · 公元${s.year<0?'前'+(-s.year):s.year}年</div>
    <div class="bl">${esc(s.blurb)}</div><div class="dis"><b>你信哪个？</b>${esc(s.dispute)}</div>
    ${s.hui.map(h=>`<h2>${esc(h.title)}</h2><div class="tx">${h.text.split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`).join('')}
    <div class="src"><b>出处</b><ul>${(s.sources||[]).map(x=>`<li>${esc(T[x.type]||x.type)} · ${esc(x.title)} — ${esc(x.cite)} · <a href="${esc(x.url)}" target="_blank" rel="noopener nofollow">原文</a>${x.quote?'<br>「'+esc(x.quote)+'」':''}</li>`).join('')}</ul></div>`;
})();
</script>
</body></html>
